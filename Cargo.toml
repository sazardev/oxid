[workspace]
resolver = "3"
members = ["crates/oxid-core", "crates/oxid-daemon", "crates/oxid-cli"]
default-members = ["crates/oxid-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "Ephemeral environments that breathe. Ferrous performance, invisible footprint."
license = "0BSD"
publish = false

[workspace.dependencies]
oxid-core = { path = "crates/oxid-core" }
thiserror = "2.0"
trait-variant = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["serde", "macros", "formatting", "parsing"] }
toml = "0.8"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync", "fs", "signal", "io-util"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "migrate", "macros"] }
bollard = "0.17"
tar = "0.4"
bytes = "1"
git2 = { version = "0.21", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
rand = "0.8"
url = "2"
futures-core = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# Maximum-performance release profile (SPEC.md §1: "Eficiencia Absoluta").
# `panic = "abort"` is safe here — neither binary uses `catch_unwind`, so
# there's nothing relying on stack unwinding, and dropping unwind tables
# shrinks the binary and removes a small amount of per-call-site overhead.
# `lto = true` + `codegen-units = 1` trade slower release builds for smaller,
# faster binaries (whole-program inlining across crate boundaries); `strip`
# drops the debug symbols the shipped binary never needs.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"