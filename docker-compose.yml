# Example self-hosting setup for Oxid (SPEC.md §6 "Configuración y
# Self-Hosting"): the daemon + Traefik, wired for scale-to-zero routing.
#
#   docker compose up -d
#
# Then point a wildcard DNS/hosts entry at this host for your chosen base
# domain (e.g. `*.local.dev` -> 127.0.0.1) and deploy a project against
# http://localhost:8080 (or through Traefik once you've registered it).
#
# This is a starting point, not a hardened production stack — see the
# comments below for what to change before exposing it beyond localhost.

services:
  traefik:
    # `latest` on purpose (verified live): Docker Engine ≥29 rejects API
    # versions <1.40 and Traefik ≤v3.5's vendored docker client negotiates
    # 1.24 — DOCKER_API_VERSION is ignored — so every router silently 404s
    # with "client version 1.24 is too old" in the proxy logs.
    image: traefik:latest
    # `oxid infra setup`/bootstrap detect Traefik by this exact name — with
    # it set, the installer's bootstrap step is a no-op instead of starting
    # a second proxy fighting over :80.
    container_name: oxid-traefik
    environment:
      DOCKER_API_VERSION: "1.41"
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=oxid-net
      # Traefik batches provider config reloads, and the 2s default is by far
      # the largest component of a wake: a scaled-to-zero branch starts its
      # container in ~150ms, then waits out this window before its route
      # exists again. Measured end-to-end (asleep -> app serving) across the
      # same environment: 2280ms at the default, ~830ms at 100ms.
      - --providers.providersThrottleDuration=100ms
      - --entrypoints.web.address=:80
      # Uncomment for TLS once you have real certificates / an ACME resolver
      # configured — do not expose plain HTTP beyond localhost otherwise.
      # - --entrypoints.websecure.address=:443
      # A dedicated entrypoint for the dashboard/API: without it, the
      # "insecure" API binds to Traefik's internal default (8080), not the
      # 8081 published below.
      - --entrypoints.traefik.address=:8081
      - --api.dashboard=true
      - --api.insecure=true # dashboard over plain HTTP — fine for localhost, remove otherwise
      # Wake-on-request (SPEC.md §3.2) needs a request against a `Paused`
      # container to fail fast: `docker pause` freezes the process but not
      # the kernel TCP stack, so a plain proxied request would otherwise
      # hang forever instead of erroring into the `errors` middleware that
      # redirects to `/api/v1/wake` (ControlPlane::traefik_labels). Per-
      # router `serversTransport` labels don't work — Traefik's Docker
      # *label* provider silently drops them (confirmed: never appears in
      # `/api/rawdata`) — so this is set once, globally, applying to every
      # Oxid-managed service automatically.
      # A stopped container's address usually black-holes rather than
      # refusing, so this timeout — not an error — is what a request to a
      # sleeping branch waits out before the `errors` middleware can hand it
      # to `/api/v1/wake`. Dialling a container on a local bridge network is
      # sub-millisecond when it is actually up, so 500ms is generous while
      # cutting ~1.5s off every wake that arrives before the route is gone.
      - --serversTransport.forwardingTimeouts.dialTimeout=500ms
      - --serversTransport.forwardingTimeouts.responseHeaderTimeout=5s
    ports:
      # Host side only. Traefik's `web` entrypoint always listens on 80
      # inside the container; change the left number (and set
      # OXID_TRAEFIK_HTTP_PORT to match, so `oxid infra status` reports the
      # same thing) if this host's 80 belongs to another proxy. Branch URLs
      # then need that port, since wildcard DNS alone cannot add one.
      - "80:80"
      # - "443:443"
      - "8081:8081" # Traefik dashboard (remove or protect before exposing this host)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - oxid-net
    restart: unless-stopped

  oxid-daemon:
    # Published by every release tag — no clone needed:
    #   curl -fsSL https://raw.githubusercontent.com/sazardev/oxid/main/install.sh | sh -s -- --docker
    image: ghcr.io/sazardev/oxid:latest
    # To build from source instead, clone this repo and uncomment:
    # build: .
    environment:
      OXID_DATA_DIR: /data
      OXID_ADDR: 0.0.0.0:8080
      # Periodic on-disk database snapshots (disaster recovery): every 300s
      # into /data/backups/, keeping the newest 7. Restore with `oxid
      # restore` (staged, applied at next daemon restart). For streaming
      # replication to S3-compatible storage run a Litestream sidecar
      # instead/alongside — see the commented service below.
      OXID_BACKUP_INTERVAL_SECS: "300"
      OXID_BACKUP_KEEP: "7"
      # Zero-config mode: any of OXID_API_TOKEN / OXID_WEBHOOK_SECRET not
      # set below is generated on first start, persisted under /data and
      # printed ONCE to `docker compose logs oxid-daemon` — that printout is
      # how you retrieve the dashboard/CLI token (the container has no
      # shell). Explicit values always win; pin yours by uncommenting:
      #   OXID_API_TOKEN: <openssl rand -hex 32>
      #   OXID_WEBHOOK_SECRET: <openssl rand -hex 32>
      OXID_AUTO_TOKEN: "1"
      # Joining Traefik's network switches deployed containers from
      # publishing a host port to being routed by Traefik labels instead
      # (see ControlPlane::with_traefik / SPEC.md §3.2).
      OXID_DOCKER_NETWORK: oxid-net
      OXID_DAEMON_URL: http://oxid-daemon:8080
    ports:
      # Direct access for the CLI/dashboard (`OXID_API=http://localhost:8080`).
      # Bound to loopback deliberately: `GET /api/v1/setup/token` (used by
      # `oxid token generate` and the onboarding wizard's "generate for me"
      # button) hands over the auto-generated master token pre-auth — that's
      # only safe because nothing off this host can reach the port at all.
      # Widen to `"8080:8080"` (all interfaces) only over a private/trusted
      # network, and prefer setting an explicit OXID_API_TOKEN first if you
      # do. Traefik only routes *deployed environments*, not this control
      # API — remove this line entirely if you'd rather reach it exclusively
      # through Traefik/a private network.
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - oxid-data:/data
      # Register projects from checkouts the daemon can read (the daemon
      # container has no shell of its own): clone into ./repos on the host,
      # then POST /api/v1/projects {"repo_dir": "/repos/<name>"} — after
      # that, webhook pushes deploy like anywhere else.
      - ./repos:/repos
    networks:
      - oxid-net
    labels:
      # Wake-on-request needs a Traefik service pointing back at this
      # daemon's own /api/v1/wake, shared across every branch of every
      # project. Per-branch containers get their own routing/heartbeat
      # labels automatically from ControlPlane::deploy — see
      # `traefik_labels` in
      # crates/oxid-daemon/src/service/control_plane/infra.rs
      # for exactly what gets attached to each deployed environment.
      - traefik.enable=true
      - traefik.docker.network=oxid-net
      - traefik.http.services.oxid-wake.loadbalancer.server.port=8080
      # Wake-on-request's *discovery* half. A scaled-to-zero branch is a
      # stopped container, and Traefik only publishes routers for running
      # ones — so the branch's own `Host()` router is gone precisely when
      # someone needs it, and the request would 404 at the proxy with
      # nothing left to trigger the wake. This catch-all lives on the daemon
      # (which is never scaled to zero), matches any host nothing else
      # claimed, and rewrites the path to `/api/v1/wake`, which resolves the
      # original `Host` header back to its environment and starts it.
      #
      # `priority=1` is the lowest Traefik accepts: any real branch router
      # outranks it, so this only ever sees hosts with no live container
      # behind them. Unknown hosts get the same 404 they always did, just
      # from the daemon instead of the proxy.
      - traefik.http.routers.oxid-wake-catchall.rule=HostRegexp(`^.+$`)
      - traefik.http.routers.oxid-wake-catchall.priority=1
      - traefik.http.routers.oxid-wake-catchall.entrypoints=web
      - traefik.http.routers.oxid-wake-catchall.service=oxid-wake
      - traefik.http.routers.oxid-wake-catchall.middlewares=oxid-wake-rewrite
      - traefik.http.middlewares.oxid-wake-rewrite.replacepath.path=/api/v1/wake
    restart: unless-stopped

  # OPTIONAL: streaming replication of the SQLite database to off-site
  # storage (S3/GCS/Azure) via Litestream — a stronger disaster-recovery
  # posture than the periodic on-disk snapshots above, since it survives
  # losing the host entirely. Point LITESTREAM_ACCESS_KEY_ID/SECRET at your
  # bucket credentials and uncomment:
  #
  #   litestream:
  #     image: litestream/litestream:latest
  #     command: replicate /data/audit.sqlite s3://your-bucket/oxid/audit.sqlite
  #     environment:
  #       LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:?set it}
  #       LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:?set it}
  #     volumes:
  #       - oxid-data:/data
  #     # Shares the oxid-data volume with the daemon so it can read the
  #     # live database (WAL-safe); restore with `litestream restore`.
  #     networks:
  #       - oxid-net
  #     restart: unless-stopped

networks:
  oxid-net:
    name: oxid-net

volumes:
  oxid-data:
