<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600&family=Fira+Sans:wght@500;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="brand.css" />
<style>
  body { width: 100vw; height: 100vh; }
  .frame { align-items: center; justify-content: center; flex-direction: column; gap: 2.2vw; }
  .mark-wrap { width: 15vw; height: 15vw; display: flex; align-items: center; justify-content: center; }
  .mark-wrap svg { width: 100%; height: 100%; }
  .wordmark { font-size: 7.5vw; display: flex; align-items: baseline; }
  .cursor { width: 0.42em; height: 0.62em; margin-left: 0.1em; }
  .tagline { font-size: 3vw; margin-top: 0.6vw; }
  .subtagline { font-size: 1.55vw; margin-top: 0.9vw; }
  .chip { font-size: 1.4vw; padding: 0.7vw 1.4vw; margin-top: 2vw; }
  .badge { font-size: 1.1vw; padding: 0.5vw 1.1vw; gap: 0.6vw; position: absolute; top: 3vw; right: 3vw; }
  .corner { position: absolute; width: 2.2vw; height: 2.2vw; border-color: var(--orange); }
  .corner.tl { top: -1px; left: -1px; border-top: 3px solid var(--orange); border-left: 3px solid var(--orange); }
  .corner.br { bottom: -1px; right: -1px; border-bottom: 3px solid var(--orange); border-right: 3px solid var(--orange); }
</style>
</head>
<body>
  <div class="frame">
    <div class="grid-bg"></div>
    <div class="wash"></div>
    <div class="corner tl"></div>
    <div class="corner br"></div>
    <div class="badge"><span class="dot"></span>self-hosted&nbsp;·&nbsp;0BSD&nbsp;·&nbsp;rust</div>
    <div class="mark-wrap">
      <svg viewBox="0 0 120 120" role="img" aria-label="Oxid">
        <path d="M37.5,21.03 L15,60 L37.5,98.97 L82.5,98.97 L105,60 L82.5,21.03"
          fill="none" stroke="#DE5236" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
    <h1 class="wordmark">oxid<span class="cursor"></span></h1>
    <p class="tagline">Every branch comes alive.</p>
    <p class="subtagline">Push&nbsp;→&nbsp;live preview. Idle&nbsp;→&nbsp;scales to zero, RAM back.</p>
    <code class="chip"><span class="tk">$</span> curl -fsSL raw.githubusercontent.com/sazardev/oxid/main/install.sh | sh</code>
  </div>
</body>
</html>
