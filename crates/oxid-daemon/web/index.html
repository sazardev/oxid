<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- `viewport-fit=cover` lets the sticky top bar sit under a notch
         rather than beside it; the padding below keeps content clear of it.
         Zoom is deliberately not capped — a low-vision user pinching to
         200% is the whole point of not capping it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Oxid — Control Plane</title>
    <meta name="description" content="Ephemeral, branch-based preview environments." />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#121212" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Oxid" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/i18n.js" defer></script>
    <script src="/app.js" defer></script>
    <script src="/vendor/alpine.min.js" defer></script>
  </head>
  <body x-data="dashboard()" x-init="init()">
    <a class="skip-link" href="#main" x-text="t('a11y.skipToContent')"></a>
    <header class="topbar" x-show="route.name !== 'onboarding'" x-cloak>
      <div class="brand">
        <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
          <path
            d="M50 4 L93 27 V73 L50 96 L7 73 V27 Z"
            fill="none"
            stroke="#DE5236"
            stroke-width="6"
          />
          <path d="M50 4 L93 27" stroke="#121212" stroke-width="8" />
        </svg>
        <span class="wordmark">OXID</span>
        <span class="tagline" x-text="t('app.tagline')"></span>
      </div>
      <nav class="nav" :aria-label="t('a11y.mainNav')">
        <a href="/ui/environments" :class="route.name==='environments'&&'active'" :aria-current="route.name==='environments' ? 'page' : false" @click.prevent="go('/ui/environments')" x-text="t('nav.environments')"></a>
        <a href="/ui/projects" :class="(route.name==='projects'||route.name==='project'||route.name==='projectSecrets')&&'active'" @click.prevent="go('/ui/projects')" x-text="t('nav.projects')"></a>
        <a href="/ui/queue" :class="route.name==='queue'&&'active'" @click.prevent="go('/ui/queue')" x-text="t('nav.queue')"></a>
        <a href="/ui/audit" :class="route.name==='audit'&&'active'" @click.prevent="go('/ui/audit')" x-text="t('nav.audit')"></a>
        <a href="/ui/secrets" :class="route.name==='secrets'&&'active'" @click.prevent="go('/ui/secrets')" x-text="t('nav.secrets')"></a>
        <a href="/ui/admin" :class="route.name==='admin'&&'active'" @click.prevent="go('/ui/admin')" x-text="t('nav.admin')"></a>
        <a href="/ui/diagnostics" :class="route.name==='diagnostics'&&'active'" @click.prevent="go('/ui/diagnostics')" x-text="t('nav.diagnostics')"></a>
        <a href="/ui/onboarding" :class="route.name==='onboarding'&&'active'" @click.prevent="go('/ui/onboarding')" :title="t('nav.setupTitle')" x-text="t('nav.setup')"></a>
      </nav>
      <div class="conn">
        <span
          class="dot"
          :class="online ? 'dot-green' : 'dot-red'"
          :title="online ? t('conn.connected') : t('conn.unreachable')"
        ></span>
        <input
          class="token-input"
          type="password"
          :placeholder="t('conn.tokenPlaceholder')"
          x-model="token"
          @change="saveToken()"
        />
        <select
          class="token-input lang-select"
          :title="t('conn.language')"
          :aria-label="t('conn.language')"
          x-model="locale"
          @change="setLocale(locale)"
        >
          <template x-for="l in locales" :key="l.code">
            <option :value="l.code" x-text="l.label" :title="l.name"></option>
          </template>
        </select>
        <button class="btn btn-ghost" @click="loadForRoute()" :title="t('conn.refresh')">⟳</button>
      </div>
    </header>

    <div class="banner banner-error" x-show="authError && route.name !== 'onboarding'" x-cloak>
      <span x-text="t('banner.authError')"></span>
    </div>
    <div class="banner banner-error" x-show="connError && route.name !== 'onboarding'" x-cloak>
      <!-- `apiBase` is empty when the panel is served by the daemon it
           talks to, which is the normal case — printing it produced
           "cannot reach the daemon at ." The page's own origin is the
           honest answer, and the one an operator can check. -->
      <span x-text="t('banner.connError')"></span> <code x-text="apiBase || location.origin"></code>.
    </div>
    <div
      class="banner banner-ok"
      role="status"
      aria-live="polite"
      x-show="notice && route.name !== 'onboarding'"
      x-cloak
      x-text="notice + '  ' + t('banner.dismiss')"
      @click="notice = ''"
    ></div>

    <section class="stats" x-show="route.name !== 'onboarding'" x-cloak>
      <div class="stat-card">
        <div class="stat-value" x-text="stats.projects ?? '—'"></div>
        <div class="stat-label" x-text="t('stats.projects')"></div>
      </div>
      <div class="stat-card">
        <div class="stat-value state-running" x-text="stats.environments_running ?? '—'"></div>
        <div class="stat-label" x-text="t('stats.running')"></div>
      </div>
      <div class="stat-card">
        <div class="stat-value state-paused" x-text="stats.environments_paused ?? '—'"></div>
        <div class="stat-label" x-text="t('stats.paused')"></div>
      </div>
      <div class="stat-card">
        <div class="stat-value state-building" x-text="stats.environments_building ?? '—'"></div>
        <div class="stat-label" x-text="t('stats.building')"></div>
      </div>
      <div class="stat-card">
        <div class="stat-value" x-text="stats.environments_hibernating ?? '—'"></div>
        <div class="stat-label" x-text="t('stats.hibernating')"></div>
      </div>
      <div class="stat-card">
        <div class="stat-value state-build_failed" x-text="stats.environments_build_failed ?? '—'"></div>
        <div class="stat-label" x-text="t('stats.failed')"></div>
      </div>
      <div class="stat-card">
        <div class="stat-value" x-text="stats.queue_length ?? '—'"></div>
        <div class="stat-label" x-text="t('stats.queued')"></div>
      </div>
      <div class="stat-card">
        <div class="stat-value stat-value-text" x-text="hostMemoryLabel()"></div>
        <div class="stat-label" x-text="t('stats.hostMemory')"></div>
      </div>
    </section>

    <main id="main" :class="route.name === 'onboarding' ? 'onboarding-container' : 'page-container'">
      <!-- ================= ENVIRONMENTS (home) ================= -->
      <section class="page" x-show="route.name === 'environments'" x-cloak>
        <p class="muted" x-show="!stats.traefik_enabled"
           x-text="t('env.noTraefik', { var: 'OXID_DOCKER_NETWORK' })"></p>
        <div class="page-head">
          <h1 x-text="t('env.title')"></h1>
          <div class="filters">
            <select class="token-input mono" x-model="filterProject" @change="setQuery({project: filterProject})">
              <option value="" x-text="t('env.allProjects')"></option>
              <template x-for="p in projects" :key="p.id">
                <option :value="p.id" x-text="p.name"></option>
              </template>
            </select>
            <select class="token-input mono" x-model="filterState" @change="setQuery({state: filterState})">
              <option value="" x-text="t('env.allStates')"></option>
              <option value="running" x-text="t('state.running')"></option>
              <option value="paused" x-text="t('state.paused')"></option>
              <option value="building" x-text="t('state.building')"></option>
              <option value="hibernating" x-text="t('state.hibernating')"></option>
              <option value="build_failed" x-text="t('state.build_failed')"></option>
            </select>
            <input
              class="token-input mono"
              type="text"
              :placeholder="t('env.searchBranch')"
              x-model="filterQuery"
              @input.debounce.300ms="setQuery({q: filterQuery})"
            />
          </div>
        </div>
        <template x-if="filteredEnvironments().length === 0">
          <p class="muted" x-text="t('env.empty', { cmd: 'oxid up <branch>' })"></p>
        </template>
        <div class="bulk-bar" x-show="selectedEnvironments().length > 0" x-cloak>
          <span class="mono" x-text="tn('env.selected', selectedEnvironments().length)"></span>
          <button class="btn btn-sm" :disabled="bulkBusy" @click="bulk('pause')" x-text="t('action.pause')"></button>
          <button class="btn btn-sm" :disabled="bulkBusy" @click="bulk('wake')" x-text="t('action.wake')"></button>
          <button class="btn btn-sm btn-danger" :disabled="bulkBusy" @click="bulk('destroy')" x-text="t('action.destroy')"></button>
          <button class="btn btn-sm btn-ghost" @click="selection = []" x-text="t('env.clearSelection')"></button>
        </div>
        <div class="table-scroll">
          <table class="env-table" x-show="filteredEnvironments().length > 0">
            <thead>
              <tr>
                <th class="col-select">
                  <!-- The label is the target, not the box: a checkbox is a
                       replaced element, so padding on it does not enlarge the
                       area that responds to a tap. -->
                  <label class="check">
                    <input
                      type="checkbox"
                      :aria-label="t('env.selectAll')"
                      :title="t('env.selectAll')"
                      :checked="allVisibleSelected()"
                      @change="toggleSelectAll()"
                    />
                  </label>
                </th>
                <th x-text="t('env.col.project')"></th>
                <th x-text="t('env.col.branch')"></th>
                <th x-text="t('env.col.state')"></th>
                <th x-text="t('env.col.url')"></th>
                <th x-text="t('env.col.created')"></th>
                <th x-text="t('env.col.lastSeen')"></th>
                <th x-text="t('env.col.updated')"></th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="env in filteredEnvironments()" :key="env.id">
                <tr :class="'row-' + env.state">
                  <td class="col-select">
                    <!-- The label is the target, not the box: a checkbox is a
                         replaced element, so padding on it does not enlarge the
                         area that responds to a tap. -->
                    <label class="check">
                      <input
                        type="checkbox"
                        :aria-label="t('env.selectOne', { branch: env.branch.name })"
                        :checked="isSelected(env)"
                        @change="toggleSelected(env)"
                      />
                    </label>
                  </td>
                  <td :data-label="t('env.col.project')">
                    <a class="link" href="#" @click.prevent="go('/ui/projects/' + env.projectId)" x-text="env.projectName"></a>
                  </td>
                  <td :data-label="t('env.col.branch')" class="mono">
                    <a class="link" href="#" @click.prevent="go('/ui/environments/' + env.id)" x-text="env.branch.name"></a>
                  </td>
                  <td :data-label="t('env.col.state')">
                    <span class="badge" :class="'badge-' + env.state">
                      <span x-show="env.state === 'building'" class="spinner"></span>
                      <span x-text="stateLabel(env.state)"></span>
                    </span>
                  </td>
                  <td :data-label="t('env.col.url')">
                    <a class="mono link" :href="envLink(env)" target="_blank" rel="noopener" x-text="envLinkLabel(env)"></a>
                  </td>
                  <td :data-label="t('env.col.created')" class="mono muted" x-text="formatTime(env.created_at)"></td>
                  <td :data-label="t('env.col.lastSeen')" class="mono muted" x-text="formatTime(env.last_accessed_at)"></td>
                  <td :data-label="t('env.col.updated')" class="mono muted" x-text="formatTime(env.updated_at)"></td>
                  <td class="actions">
                    <button class="btn btn-sm" x-show="env.state === 'running'" @click="pause(env)" x-text="t('action.pause')"></button>
                    <button
                      class="btn btn-sm"
                      x-show="env.state === 'paused' || env.state === 'hibernating'"
                      @click="wake(env)"
                      x-text="t('action.wake')"
                    ></button>
                    <button class="btn btn-sm btn-danger" x-show="env.state !== 'destroyed'" @click="destroy(env)"
                            x-text="t('action.destroy')"></button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </section>

      <!-- ================= ENVIRONMENT DETAIL ================= -->
      <section class="page" x-show="route.name === 'environment'" x-cloak>
        <template x-if="currentEnvironment()">
          <div>
            <div class="page-head">
              <h1>
                <a class="link" href="#" @click.prevent="go('/ui/projects/' + currentEnvironment().projectId)" x-text="currentEnvironment().projectName"></a>
                / <span class="mono" x-text="currentEnvironment().branch.name"></span>
                <span class="badge" :class="'badge-' + currentEnvironment().state" x-text="stateLabel(currentEnvironment().state)"></span>
              </h1>
              <div class="project-actions">
                <button class="btn btn-sm" x-show="currentEnvironment().state === 'running'" @click="pause(currentEnvironment())" x-text="t('action.pause')"></button>
                <button
                  class="btn btn-sm"
                  x-show="currentEnvironment().state === 'paused' || currentEnvironment().state === 'hibernating'"
                  @click="wake(currentEnvironment())"
                  x-text="t('action.wake')"
                ></button>
                <button
                  class="btn btn-sm"
                  @click="rollback({id: currentEnvironment().projectId}, currentEnvironment())"
                  x-text="t('action.rollback')"
                ></button>
                <button class="btn btn-sm btn-danger" x-show="currentEnvironment().state !== 'destroyed'" @click="destroy(currentEnvironment())"
                        x-text="t('action.destroy')"></button>
              </div>
            </div>

            <dl class="data-grid mono">
              <dt x-text="t('env.field.id')"></dt><dd x-text="currentEnvironment().id"></dd>
              <dt x-text="t('env.field.url')"></dt><dd><a class="link" :href="envLink(currentEnvironment())" target="_blank" rel="noopener" x-text="envLinkLabel(currentEnvironment())"></a></dd>
              <dt x-show="!stats.traefik_enabled" class="muted" x-text="t('env.field.note')"></dt>
              <dd x-show="!stats.traefik_enabled" class="muted"
                  x-text="t('env.directNote', { url: currentEnvironment().url })"></dd>
              <dt x-text="t('env.field.commit')"></dt><dd x-text="currentEnvironment().branch.commit_sha"></dd>
              <dt x-text="t('env.field.created')"></dt><dd x-text="formatTime(currentEnvironment().created_at)"></dd>
              <dt x-text="t('env.field.lastSeen')"></dt><dd x-text="formatTime(currentEnvironment().last_accessed_at)"></dd>
              <dt x-text="t('env.field.updated')"></dt><dd x-text="formatTime(currentEnvironment().updated_at)"></dd>
            </dl>

            <div class="tabs">
              <a href="#" :class="(!query.tab||query.tab==='overview')&&'active'" @click.prevent="setQuery({tab:null})" x-text="t('env.tab.overview')"></a>
              <a href="#" :class="query.tab==='logs'&&'active'" @click.prevent="setQuery({tab:'logs'})" x-text="t('env.tab.logs')"></a>
              <a href="#" :class="query.tab==='history'&&'active'" @click.prevent="setQuery({tab:'history'})" x-text="t('env.tab.history')"></a>
            </div>

            <div x-show="query.tab === 'logs'">
              <div class="tabs" x-show="envServices.length > 1">
                <template x-for="svc in envServices" :key="svc.name">
                  <a href="#" :class="logService===svc.name&&'active'"
                     @click.prevent="selectLogService(environment.id, svc.name)">
                    <span x-text="svc.name"></span>
                    <span class="muted" x-show="svc.is_primary" x-text="t('env.primaryService')"></span>
                  </a>
                </template>
              </div>
              <pre class="log-output" x-ref="logOutput" x-text="logLines.join('\n')"></pre>
            </div>

            <div x-show="query.tab === 'history'">
              <ol class="audit-list">
                <template x-for="event in historyEvents" :key="event.id">
                  <li>
                    <span class="mono muted" x-text="formatTime(event.occurred_at)"></span>
                    <span class="badge badge-audit" x-text="event.kind"></span>
                    <span
                      class="mono"
                      x-show="auditDuration(event) !== null"
                      x-text="formatDuration(auditDuration(event))"
                    ></span>
                    <span class="muted" x-text="event.operator ?? t('audit.anonymous')"></span>
                    <span class="muted" x-text="event.detail ?? ''"></span>
                  </li>
                </template>
                <li x-show="historyEvents.length === 0" class="muted" x-text="t('env.noAudit')"></li>
              </ol>
            </div>
          </div>
        </template>
        <template x-if="!currentEnvironment()">
          <p class="muted" x-text="t('env.notFound')"></p>
        </template>
      </section>

      <!-- ================= PROJECTS ================= -->
      <section class="page" x-show="route.name === 'projects'" x-cloak>
        <div class="page-head">
          <h1 x-text="t('project.title')"></h1>
        </div>
        <div class="card">
          <h2 x-text="t('project.registerTitle')"></h2>
          <p class="muted" x-text="t('project.registerHint')"></p>
          <div class="form-row">
            <select class="token-input mono" x-model="newProject.mode">
              <option value="url" x-text="t('project.registerModeUrl')"></option>
              <option value="dir" x-text="t('project.registerModeDir')"></option>
            </select>
            <input
              class="token-input mono grow"
              type="text"
              x-show="newProject.mode === 'url'"
              :placeholder="t('project.registerUrlPlaceholder')"
              x-model="newProject.repoUrl"
              @keydown.enter="registerProject()"
            />
            <input
              class="token-input mono grow"
              type="text"
              x-show="newProject.mode === 'dir'"
              :placeholder="t('project.registerDirPlaceholder')"
              x-model="newProject.repoDir"
              @keydown.enter="registerProject()"
            />
            <input
              class="token-input mono"
              type="password"
              x-show="newProject.mode === 'url'"
              :placeholder="t('project.registerTokenPlaceholder')"
              x-model="newProject.gitToken"
            />
            <button class="btn" :disabled="newProject.busy" @click="registerProject()"
                    x-text="newProject.busy ? t('action.working') : t('action.register')"></button>
          </div>
          <p class="error-text" x-show="newProject.error" x-text="newProject.error"></p>
        </div>
        <div class="table-scroll">
          <table class="env-table">
            <thead>
              <tr>
                <th x-text="t('project.col.name')"></th>
                <th x-text="t('project.col.repo')"></th>
                <th x-text="t('project.col.port')"></th>
                <th x-text="t('project.col.environments')"></th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="p in projects" :key="p.id">
                <tr>
                  <td :data-label="t('project.col.name')">
                    <a class="link" href="#" @click.prevent="go('/ui/projects/' + p.id)" x-text="p.name"></a>
                    <span class="badge badge-stack" x-show="p.detected_stack"
                          :title="t('project.stackTitle', { evidence: (p.detected_stack?.evidence ?? []).join(', ') })"
                          x-text="stackLabel(p.detected_stack)"></span>
                  </td>
                  <td :data-label="t('project.col.repo')" class="mono muted" x-text="p.repo_url"></td>
                  <td :data-label="t('project.col.port')" class="mono" x-text="p.config.port"></td>
                  <td :data-label="t('project.col.environments')" class="mono" x-text="p.environments.length"></td>
                  <td class="actions">
                    <button class="btn btn-sm" @click="go('/ui/projects/' + p.id)" x-text="t('action.open')"></button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </section>

      <!-- ================= PROJECT DETAIL ================= -->
      <section class="page" x-show="route.name === 'project'" x-cloak x-effect="maybeInitProjectSettingsForm(currentProject())">
        <template x-if="currentProject()">
          <div>
            <div class="page-head">
              <h1 x-text="currentProject().name"></h1>
              <div class="project-actions">
                <button class="btn btn-sm" @click="go('/ui/projects/' + currentProject().id + '/secrets')" x-text="t('action.secrets')"></button>
                <button class="btn btn-sm btn-danger" @click="removeProject(currentProject())" x-text="t('project.deleteProject')"></button>
              </div>
            </div>
            <p class="mono muted" x-text="currentProject().repo_url"></p>
            <div class="card" x-show="currentProject().workspace">
              <h2 x-text="t('project.workspaceTitle')"></h2>
              <p class="muted" x-text="t('project.workspaceHint', {
                kind: currentProject().workspace?.kind,
                runner: currentProject().workspace?.task_runner ?? '—'
              })"></p>
              <ul class="workspace-list">
                <template x-for="svc in currentProject().workspace?.deployable ?? []" :key="svc.path">
                  <li>
                    <code x-text="svc.path"></code>
                    <span class="badge badge-stack" x-text="svc.framework"></span>
                    <span class="muted mono" x-text="svc.name + ' :' + svc.port"></span>
                    <span class="badge" x-show="svc.path === currentProject().config.build.context"
                          x-text="t('project.workspaceActive')"></span>
                  </li>
                </template>
              </ul>
              <p class="muted" x-text="t('project.workspaceSwitch')"></p>
            </div>
            <p class="muted" x-show="currentProject().detected_stack">
              <span class="badge badge-stack" x-text="stackLabel(currentProject().detected_stack)"></span>
              <span x-text="t('project.stackDetected', {
                evidence: (currentProject().detected_stack?.evidence ?? []).join(', '),
                confidence: confidenceLabel(currentProject().detected_stack)
              })"></span>
            </p>
            <dl class="data-grid mono">
              <dt :title="t('project.field.containerPortTitle')" x-text="t('project.field.containerPort')"></dt><dd x-text="currentProject().config.port"></dd>
              <dt x-text="t('project.field.dockerfile')"></dt><dd x-text="currentProject().config.build.dockerfile ?? 'Dockerfile'"></dd>
              <dt x-text="t('project.field.context')"></dt><dd x-text="currentProject().config.build.context"></dd>
              <dt x-show="currentProject().config.build.memory_limit_mb" x-text="t('project.field.memoryLimit')"></dt>
              <dd x-show="currentProject().config.build.memory_limit_mb" x-text="currentProject().config.build.memory_limit_mb + 'MB'"></dd>
              <dt x-show="currentProject().config.build.cpu_limit_millicores" x-text="t('project.field.cpuLimit')"></dt>
              <dd x-show="currentProject().config.build.cpu_limit_millicores" x-text="currentProject().config.build.cpu_limit_millicores + 'm'"></dd>
              <dt x-show="currentProject().config.dependencies.length" x-text="t('project.field.dependencies')"></dt>
              <dd x-show="currentProject().config.dependencies.length">
                <template x-for="dep in currentProject().config.dependencies" :key="dep.shared_instance">
                  <span class="badge badge-audit" x-text="dep.kind + ':' + dep.shared_instance"></span>
                </template>
              </dd>
            </dl>

            <h2 x-text="t('project.lifetime.title')"></h2>
            <p class="muted" x-text="t('project.lifetime.help', { file: 'oxid.toml' })"></p>
            <div class="secret-form">
              <label class="mono muted">pause_after</label>
              <input
                class="token-input mono"
                type="text"
                :placeholder="t('project.lifetime.pausePlaceholder')"
                x-model="projectSettingsForm.pause_after"
              />
              <label class="mono muted">destroy_after</label>
              <input
                class="token-input mono"
                type="text"
                :placeholder="t('project.lifetime.destroyPlaceholder')"
                x-model="projectSettingsForm.destroy_after"
              />
              <button class="btn btn-sm" @click="saveProjectSettings(currentProject())" x-text="t('action.save')"></button>
            </div>

            <h2 x-text="t('project.git.title')"></h2>
            <p class="muted" x-text="t('project.git.help')"></p>
            <div class="secret-form">
              <label class="mono muted">git_token</label>
              <input
                class="token-input mono"
                type="password"
                :placeholder="t('project.git.placeholder')"
                x-model="projectSettingsForm.git_token"
              />
              <button class="btn btn-sm" @click="saveGitToken(currentProject())" x-text="t('action.save')"></button>
              <button class="btn btn-sm btn-danger" @click="clearGitToken(currentProject())" x-text="t('action.clear')"></button>
            </div>

            <div class="deploy-form">
              <input
                class="token-input mono"
                type="text"
                :placeholder="t('project.deployPlaceholder')"
                x-model="deployBranch"
                @keydown.enter="deployNew(currentProject())"
              />
              <button class="btn btn-sm" @click="deployNew(currentProject())" x-text="t('action.deploy')"></button>
            </div>

            <h2 x-text="t('project.environments')"></h2>
            <template x-if="currentProject().environments.length === 0">
              <p class="muted" x-text="t('project.noBranches')"></p>
            </template>
            <div class="table-scroll">
              <table class="env-table" x-show="currentProject().environments.length > 0">
                <thead>
                  <tr>
                    <th x-text="t('env.col.branch')"></th>
                    <th x-text="t('env.col.state')"></th>
                    <th x-text="t('env.col.url')"></th>
                    <th x-text="t('env.col.updated')"></th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="env in currentProject().environments" :key="env.id">
                    <tr :class="'row-' + env.state">
                      <td :data-label="t('env.col.branch')" class="mono">
                        <a class="link" href="#" @click.prevent="go('/ui/environments/' + env.id)" x-text="env.branch.name"></a>
                      </td>
                      <td :data-label="t('env.col.state')">
                        <span class="badge" :class="'badge-' + env.state" x-text="stateLabel(env.state)"></span>
                      </td>
                      <td :data-label="t('env.col.url')"><a class="mono link" :href="envLink(env)" target="_blank" rel="noopener" x-text="envLinkLabel(env)"></a></td>
                      <td :data-label="t('env.col.updated')" class="mono muted" x-text="formatTime(env.updated_at)"></td>
                      <td class="actions">
                        <button class="btn btn-sm" @click="go('/ui/environments/' + env.id)" x-text="t('action.open')"></button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </template>
        <template x-if="!currentProject()">
          <p class="muted" x-text="t('project.notFound')"></p>
        </template>
      </section>

      <!-- ================= SECRETS (global + project-scoped) ================= -->
      <section class="page" x-show="route.name === 'secrets' || route.name === 'projectSecrets'" x-cloak>
        <h1 x-text="route.name === 'projectSecrets' ? t('secrets.projectTitle', { name: currentProject()?.name ?? '' }) : t('secrets.globalTitle')"></h1>
        <p class="muted" x-text="t('secrets.help')"></p>
        <ol class="audit-list">
          <template x-for="s in secretsList" :key="s.name + s.scope">
            <li>
              <span class="mono" x-text="s.name"></span>
              <span class="badge badge-audit" x-text="s.scope"></span>
              <button class="btn btn-sm btn-danger" @click="deleteSecret(s)" x-text="t('action.delete')"></button>
            </li>
          </template>
          <li x-show="secretsList.length === 0" class="muted" x-text="t('secrets.empty')"></li>
        </ol>
        <h2 x-text="t('secrets.setTitle')"></h2>
        <div class="secret-form">
          <input class="token-input mono" type="text" :placeholder="t('secrets.namePlaceholder')" x-model="secretForm.name" />
          <select class="token-input mono" x-model="secretForm.scope" x-show="route.name === 'projectSecrets'">
            <option value="project" x-text="t('secrets.scope.project')"></option>
            <option value="branch" x-text="t('secrets.scope.branch')"></option>
          </select>
          <input
            class="token-input mono"
            type="text"
            :placeholder="t('secrets.branchPlaceholder')"
            x-model="secretForm.branch"
            x-show="secretForm.scope === 'branch'"
          />
          <input class="token-input mono" type="password" :placeholder="t('secrets.valuePlaceholder')" x-model="secretForm.value" />
          <button class="btn btn-sm" @click="submitSecret()" x-text="t('action.set')"></button>
        </div>
      </section>

      <!-- ================= QUEUE ================= -->
      <section class="page" x-show="route.name === 'queue'" x-cloak>
        <h1 x-text="t('queue.title')"></h1>
        <p class="muted" x-text="t('queue.hint')"></p>
        <template x-if="queue.length === 0">
          <p class="muted" x-text="t('queue.empty')"></p>
        </template>
        <div class="table-scroll">
          <table class="env-table" x-show="queue.length > 0">
            <thead>
              <tr>
                <th x-text="t('queue.col.position')"></th>
                <th x-text="t('queue.col.project')"></th>
                <th x-text="t('queue.col.branch')"></th>
                <th x-text="t('queue.col.operator')"></th>
                <th x-text="t('queue.col.requested')"></th>
                <th x-text="t('queue.col.attempts')"></th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(item, i) in queue" :key="item.id">
                <tr>
                  <td :data-label="t('queue.col.position')" class="mono" x-text="i + 1"></td>
                  <td :data-label="t('queue.col.project')"><a class="link" href="#" @click.prevent="go('/ui/projects/' + item.project_id)" x-text="projectName(item.project_id)"></a></td>
                  <td :data-label="t('queue.col.branch')" class="mono" x-text="item.branch"></td>
                  <td :data-label="t('queue.col.operator')" class="muted" x-text="item.operator ?? t('audit.anonymous')"></td>
                  <td :data-label="t('queue.col.requested')" class="mono muted" x-text="formatTime(item.requested_at)"></td>
                  <td :data-label="t('queue.col.attempts')" class="mono muted" x-text="item.attempts || 0"></td>
                  <td class="actions">
                    <button class="btn btn-sm btn-danger" @click="cancelQueued(item)" x-text="t('action.cancelDeploy')"></button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </section>

      <!-- ================= AUDIT ================= -->
      <section class="page" x-show="route.name === 'audit'" x-cloak>
        <div class="page-head">
          <h1 x-text="t('audit.title')"></h1>
          <div class="filters">
            <input
              class="token-input mono"
              type="number"
              min="1"
              :placeholder="t('audit.limitPlaceholder')"
              x-model="auditLimit"
              @change="setQuery({limit: auditLimit})"
            />
            <input
              class="token-input mono"
              type="text"
              :placeholder="t('audit.searchPlaceholder')"
              x-model="auditQuery"
              @input.debounce.300ms="setQuery({q: auditQuery})"
            />
          </div>
        </div>
        <div class="table-scroll">
          <table class="env-table">
            <thead>
              <tr>
                <th x-text="t('audit.col.when')"></th>
                <th x-text="t('audit.col.kind')"></th>
                <th x-text="t('audit.col.branch')"></th>
                <th :title="t('audit.col.deployTimeTitle')" x-text="t('audit.col.deployTime')"></th>
                <th x-text="t('audit.col.operator')"></th>
                <th x-text="t('audit.col.detail')"></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="event in filteredAudit()" :key="event.id">
                <tr :class="event.kind.toLowerCase().includes('failed') && 'row-failed'">
                  <td :data-label="t('audit.col.when')" class="mono muted" x-text="formatTime(event.occurred_at)"></td>
                  <td :data-label="t('audit.col.kind')"><span class="badge badge-audit" x-text="event.kind"></span></td>
                  <td :data-label="t('audit.col.branch')">
                    <a
                      class="mono link"
                      href="#"
                      @click.prevent="go('/ui/environments/' + event.environment_id)"
                      :title="t('audit.envTitle', { id: event.environment_id })"
                      x-text="envRef(event.environment_id)"
                    ></a>
                  </td>
                  <td :data-label="t('audit.col.deployTime')" class="mono" x-text="formatDuration(auditDuration(event))"></td>
                  <td :data-label="t('audit.col.operator')" class="muted" x-text="event.operator ?? t('audit.anonymous')"></td>
                  <td :data-label="t('audit.col.detail')" class="mono detail-cell" x-text="event.detail ?? ''"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </section>

      <!-- ================= ONBOARDING WIZARD ================= -->
      <section class="page onboarding-card" x-show="route.name === 'onboarding'" x-cloak>
        <div class="onboarding-brand">
          <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
            <path
              d="M50 4 L93 27 V73 L50 96 L7 73 V27 Z"
              fill="none"
              stroke="#DE5236"
              stroke-width="6"
            />
            <path d="M50 4 L93 27" stroke="#121212" stroke-width="8" />
          </svg>
          <span class="wordmark">OXID</span>
          <span class="tagline" x-text="t('app.tagline')"></span>
        </div>
        <div class="page-head">
          <h1 x-text="t('wizard.title')"></h1>
          <button class="btn btn-sm" @click="finishOnboarding()" x-text="t('wizard.skip')"></button>
        </div>
        <p class="muted" x-text="t('wizard.intro')"></p>

        <ol class="wizard-steps">
          <li :class="wizard.step === 1 && 'active'" x-text="t('wizard.step1')"></li>
          <li :class="wizard.step === 2 && 'active'" x-text="t('wizard.step2')"></li>
          <li :class="wizard.step === 3 && 'active'" x-text="t('wizard.step3')"></li>
          <li :class="wizard.step === 4 && 'active'" x-text="t('wizard.step4')"></li>
          <li :class="wizard.step === 5 && 'active'" x-text="t('wizard.step5')"></li>
        </ol>

        <!-- Step 1: connect -->
        <div class="wizard-panel" x-show="wizard.step === 1">
          <h2 x-text="t('wizard.s1.title')"></h2>
          <template x-if="setupStatus && !setupStatus.auth_required">
            <p x-text="t('wizard.s1.open')"></p>
          </template>
          <template x-if="setupStatus && setupStatus.auth_required">
            <div>
              <p x-text="t('wizard.s1.paste', { storage: 'localStorage', header: 'Authorization: Bearer …' })"></p>
              <template x-if="setupStatus.auto_token">
                <div class="wizard-hint">
                  <span x-text="t('wizard.s1.autoToken', { flag: 'OXID_AUTO_TOKEN=1' })"></span>
                  <div class="deploy-form">
                    <button class="btn btn-primary" :disabled="wizard.generatingToken" @click="generateToken()">
                      <span x-show="!wizard.generatingToken" x-text="t('wizard.s1.generate')"></span>
                      <span x-show="wizard.generatingToken" class="spinner"></span>
                    </button>
                  </div>
                </div>
              </template>
              <p class="muted" x-show="setupStatus.auto_token" x-text="t('wizard.s1.orPaste')"></p>
              <div class="deploy-form">
                <input
                  class="token-input mono"
                  type="password"
                  :placeholder="t('wizard.s1.tokenPlaceholder')"
                  x-model="wizard.tokenInput"
                  @keydown.enter="verifyToken()"
                />
                <button class="btn" :disabled="wizard.checkingToken" @click="verifyToken()">
                  <span x-show="!wizard.checkingToken" x-text="t('wizard.s1.verify')"></span>
                  <span x-show="wizard.checkingToken" class="spinner"></span>
                </button>
              </div>
            </div>
          </template>
          <template x-if="!setupStatus">
            <p class="muted" x-text="t('wizard.s1.noStatus')"></p>
          </template>
          <div class="wizard-nav">
            <span></span>
            <button class="btn" x-show="!setupStatus?.auth_required || token" @click="wizardGo(2)"
                    x-text="t('wizard.continue')"></button>
          </div>
        </div>

        <!-- Step 2: infrastructure -->
        <div class="wizard-panel" x-show="wizard.step === 2">
          <h2 x-text="t('wizard.s2.title')"></h2>
          <p class="muted" x-text="t('wizard.s2.help', { pattern: '<branch>.<base-domain>', var: 'OXID_DOCKER_NETWORK' })"></p>
          <template x-if="wizard.infraLoading">
            <p><span class="spinner"></span> <span x-text="t('wizard.s2.checking')"></span></p>
          </template>
          <template x-if="!wizard.infraLoading && !wizard.infra">
            <div class="wizard-hint" x-text="t('wizard.s2.directMode')"></div>
          </template>
          <template x-if="!wizard.infraLoading && wizard.infra">
            <div>
              <ul class="wizard-checklist">
                <li>
                  <span class="dot" :class="wizard.infra.network_exists ? 'dot-green' : 'dot-red'"></span>
                  <span x-text="t('wizard.s2.network')"></span> <code x-text="wizard.infra.network"></code>
                </li>
                <li>
                  <span class="dot" :class="wizard.infra.traefik_status === 'running' ? 'dot-green' : 'dot-red'"></span>
                  <span x-text="t('wizard.s2.traefik')"></span> <span class="mono" x-text="wizard.infra.traefik_status"></span>
                </li>
                <li>
                  <span class="dot" :class="wizard.infra.self_wiring_ok ? 'dot-green' : 'dot-red'"></span>
                  <span x-text="t('wizard.s2.wired')"></span>
                </li>
              </ul>
              <template x-for="step in wizard.infra.next_steps ?? []" :key="step">
                <p class="mono muted wizard-next-step" x-text="step"></p>
              </template>
              <div class="deploy-form">
                <button class="btn" :disabled="wizard.fixingInfra" @click="fixInfra()">
                  <span x-show="!wizard.fixingInfra" x-text="t('wizard.s2.fix')"></span>
                  <span x-show="wizard.fixingInfra" class="spinner"></span>
                </button>
                <span class="muted" x-text="wizard.infraError"></span>
              </div>
            </div>
          </template>
          <div class="wizard-nav">
            <button class="btn btn-ghost" @click="wizardGo(1)" x-text="t('wizard.back')"></button>
            <button class="btn" @click="wizardGo(3)" x-text="t('wizard.continue')"></button>
          </div>
        </div>

        <!-- Step 3: first project -->
        <div class="wizard-panel" x-show="wizard.step === 3">
          <h2 x-text="t('wizard.s3.title')"></h2>
          <div class="tabs">
            <a href="#" :class="wizard.projectMode==='url'&&'active'" @click.prevent="wizard.projectMode='url'" x-text="t('wizard.s3.tabUrl')"></a>
            <a href="#" :class="wizard.projectMode==='dir'&&'active'" @click.prevent="wizard.projectMode='dir'" x-text="t('wizard.s3.tabDir')"></a>
          </div>
          <template x-if="wizard.projectMode === 'url'">
            <div>
              <p class="muted" x-text="t('wizard.s3.urlHelp')"></p>
              <div class="secret-form">
                <input
                  class="token-input mono"
                  type="text"
                  placeholder="https://github.com/you/app.git"
                  x-model="wizard.repoUrl"
                />
                <input
                  class="token-input mono"
                  type="password"
                  :placeholder="t('wizard.s3.tokenPlaceholder')"
                  x-model="wizard.gitToken"
                />
              </div>
            </div>
          </template>
          <template x-if="wizard.projectMode === 'dir'">
            <div>
              <p class="muted" x-text="t('wizard.s3.dirHelp', { dir: './repos', inner: '/repos/<name>' })"></p>
              <div class="secret-form">
                <input
                  class="token-input mono"
                  type="text"
                  placeholder="/repos/my-app"
                  x-model="wizard.repoDir"
                />
              </div>
            </div>
          </template>
          <div class="secret-form">
            <label class="mono muted" x-text="t('wizard.s3.branch')"></label>
            <input
              class="token-input mono"
              type="text"
              placeholder="main"
              x-model="wizard.deployBranch"
            />
            <button class="btn" :disabled="wizard.registering" @click="registerFirstProject()">
              <span x-show="!wizard.registering" x-text="t('wizard.s3.register')"></span>
              <span x-show="wizard.registering" class="spinner"></span>
            </button>
          </div>

          <template x-if="wizard.deployState === 'building'">
            <p><span class="spinner"></span> <span x-text="t('wizard.s3.building')"></span></p>
          </template>
          <template x-if="wizard.deployState === 'running'">
            <div class="wizard-hint wizard-success">
              ✓ <span class="mono" x-text="wizard.projectName"></span>/<span class="mono" x-text="wizard.deployBranch.trim() || 'main'"></span>
              <span x-text="t('wizard.s3.live')"></span>
              <a class="link" href="#"
                 @click.prevent="go('/ui/environments/' + wizard.envId)" x-text="t('wizard.s3.openEnv')"></a>
            </div>
          </template>
          <template x-if="wizard.deployState === 'failed' || wizard.deployState === 'timeout'">
            <div class="wizard-hint wizard-failure">
              <span x-text="t('wizard.s3.failed')"></span> <span class="mono" x-text="wizard.deployMessage"></span>
              <span x-text="t('wizard.s3.failedHelp')"></span>
            </div>
          </template>

          <div class="wizard-nav">
            <button class="btn btn-ghost" @click="wizardGo(2)" x-text="t('wizard.back')"></button>
            <button class="btn" @click="wizardGo(4)" x-text="t('wizard.continue')"></button>
          </div>
        </div>

        <!-- Step 4: webhooks -->
        <div class="wizard-panel" x-show="wizard.step === 4">
          <h2 x-text="t('wizard.s4.title')"></h2>
          <p class="muted" x-text="t('wizard.s4.help')"></p>
          <div class="secret-form">
            <select class="token-input mono" x-model="wizard.provider" style="width:auto">
              <option value="github">GitHub</option>
              <option value="gitlab">GitLab</option>
              <option value="gitea">Gitea</option>
              <option value="gogs">Gogs</option>
            </select>
            <input class="token-input mono" type="text" readonly :value="webhookUrl()" />
            <button class="btn btn-sm" @click="copyText(webhookUrl(), 'url')">
              <span x-text="wizard.copied === 'url' ? t('action.copied') : t('action.copy')"></span>
            </button>
          </div>
          <template x-if="wizard.webhookSecret">
            <div class="wizard-hint">
              <span x-text="t('wizard.s4.secretHint')"></span>
              <div class="secret-form">
                <input class="token-input mono" type="text" readonly :value="wizard.webhookSecret" />
                <button class="btn btn-sm" @click="copyText(wizard.webhookSecret, 'secret')">
                  <span x-text="wizard.copied === 'secret' ? t('action.copied') : t('action.copy')"></span>
                </button>
              </div>
            </div>
          </template>
          <template x-if="wizard.webhookSecretMissing">
            <div class="wizard-hint"
                 x-text="t('wizard.s4.secretMissing', { var: 'OXID_WEBHOOK_SECRET', flag: 'OXID_AUTO_TOKEN=1' })"></div>
          </template>
          <div class="wizard-nav">
            <button class="btn btn-ghost" @click="wizardGo(3)" x-text="t('wizard.back')"></button>
            <button class="btn" @click="wizardGo(5)" x-text="t('wizard.continue')"></button>
          </div>
        </div>

        <!-- Step 5: CLI + team -->
        <div class="wizard-panel" x-show="wizard.step === 5">
          <h2 x-text="t('wizard.s5.title')"></h2>
          <p class="muted" x-text="t('wizard.s5.point', { cli: 'oxid' })"></p>
          <div class="secret-form">
            <input class="token-input mono" type="text" readonly :value="cliSnippet()" style="min-width:420px" />
            <button class="btn btn-sm" @click="copyText(cliSnippet(), 'cli')">
              <span x-text="wizard.copied === 'cli' ? t('action.copied') : t('action.copy')"></span>
            </button>
          </div>
          <p class="muted" x-text="t('wizard.s5.share', { cmd: 'oxid token create alice --project <id>' })"></p>
          <div class="secret-form">
            <input class="token-input mono" type="text" readonly :value="curlSnippet()" style="min-width:420px" />
            <button class="btn btn-sm" @click="copyText(curlSnippet(), 'curl')">
              <span x-text="wizard.copied === 'curl' ? t('action.copied') : t('action.copy')"></span>
            </button>
          </div>
          <div class="wizard-nav">
            <button class="btn btn-ghost" @click="wizardGo(4)" x-text="t('wizard.back')"></button>
            <button class="btn btn-primary" @click="finishOnboarding(t('notice.setupComplete'))"
                    x-text="t('wizard.finish')"></button>
          </div>
        </div>
      </section>

      <!-- ================= ADMIN ================= -->
      <!-- ================= DIAGNOSTICS ================= -->
      <section class="page" x-show="route.name === 'diagnostics'" x-cloak>
        <div class="page-head">
          <h1 x-text="t('diag.title')"></h1>
          <button class="btn btn-sm" :disabled="diagnostics.running" @click="runDiagnostics()"
                  x-text="diagnostics.running ? t('action.working') : t('action.recheck')"></button>
        </div>
        <p class="muted" x-text="t('diag.hint')"></p>

        <div class="card">
          <h2 x-text="t('diag.daemonTitle')"></h2>
          <dl class="data-grid mono">
            <dt x-text="t('diag.reachable')"></dt>
            <dd>
              <span class="badge" :class="diagnostics.reachable ? 'badge-running' : 'badge-build_failed'"
                    x-text="diagnostics.reachable ? t('diag.yes') : t('diag.no')"></span>
              <span class="muted" x-show="diagnostics.error" x-text="diagnostics.error"></span>
            </dd>
            <dt x-text="t('diag.version')"></dt>
            <dd x-text="diagnostics.version ?? '—'"></dd>
            <dt x-text="t('diag.latency')"></dt>
            <dd x-text="diagnostics.latencyMs !== undefined ? diagnostics.latencyMs + ' ms' : '—'"></dd>
            <dt x-text="t('diag.checkedAt')"></dt>
            <dd x-text="diagnostics.checkedAt ? formatTime(diagnostics.checkedAt) : '—'"></dd>
          </dl>
        </div>

        <div class="card">
          <h2 x-text="t('diag.credentialTitle')"></h2>
          <dl class="data-grid mono">
            <dt x-text="t('diag.tokenValid')"></dt>
            <dd>
              <span class="badge" :class="diagnostics.tokenValid ? 'badge-running' : 'badge-build_failed'"
                    x-text="diagnostics.tokenValid ? t('diag.yes') : t('diag.no')"></span>
              <span class="muted" x-show="diagnostics.tokenError" x-text="diagnostics.tokenError"></span>
            </dd>
            <dt x-show="diagnostics.tokenValid" x-text="t('diag.tokenScope')"></dt>
            <dd x-show="diagnostics.tokenValid"
                x-text="diagnostics.master ? t('diag.scopeMaster') : t('diag.scopeNamed')"></dd>
          </dl>
          <p class="muted" x-show="diagnostics.tokenValid === false" x-text="t('diag.tokenHint')"></p>
        </div>

        <div class="card">
          <h2 x-text="t('diag.capacityTitle')"></h2>
          <dl class="data-grid mono">
            <dt x-text="t('diag.hostMemory')"></dt>
            <dd x-text="hostMemoryLabel()"></dd>
            <dt x-text="t('diag.running')"></dt>
            <dd x-text="stats.environments_running"></dd>
            <dt x-text="t('diag.queued')"></dt>
            <dd>
              <span x-text="stats.queue_length"></span>
              <a class="link" href="#" x-show="stats.queue_length > 0"
                 @click.prevent="go('/ui/queue')" x-text="t('diag.seeQueue')"></a>
            </dd>
            <dt x-text="t('diag.routing')"></dt>
            <dd>
              <span class="badge" :class="stats.traefik_enabled ? 'badge-running' : 'badge-paused'"
                    x-text="stats.traefik_enabled ? t('diag.viaTraefik') : t('diag.directPublish')"></span>
              <span class="muted" x-show="!stats.traefik_enabled" x-text="t('diag.directPublishHint')"></span>
            </dd>
          </dl>
        </div>

        <div class="card" x-show="fleetNodes().length">
          <h2 x-text="t('diag.fleetTitle')"></h2>
          <p class="muted" x-text="t('diag.fleetHint')"></p>
          <table class="table">
            <thead>
              <tr>
                <th x-text="t('diag.col.node')"></th>
                <th x-text="t('diag.col.nodeState')"></th>
                <th x-text="t('diag.col.nodeMemory')"></th>
                <th x-text="t('diag.col.nodeUsed')"></th>
                <th x-text="t('diag.col.nodeEnvs')"></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="node in fleetNodes()" :key="node.id">
                <tr>
                  <td :data-label="t('diag.col.node')" class="mono" x-text="node.name"></td>
                  <td :data-label="t('diag.col.nodeState')">
                    <span class="badge" :class="nodeBadgeClass(node)" x-text="node.state"></span>
                    <span class="muted" x-show="!node.connected && node.state !== 'down'"
                          x-text="t('diag.nodeDisconnected')"></span>
                  </td>
                  <td :data-label="t('diag.col.nodeMemory')" class="mono" x-text="nodeMemoryLabel(node)"></td>
                  <td :data-label="t('diag.col.nodeUsed')" class="mono" x-text="node.committed_memory_mb + ' MB'"></td>
                  <td :data-label="t('diag.col.nodeEnvs')" class="mono" x-text="node.environments_live"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <div class="card">
          <h2 x-text="t('admin.infraTitle')"></h2>
          <p class="muted" x-show="infra.loading && !infra.error && !infra.status" x-text="t('admin.infraLoading')"></p>
          <p class="error-text" x-show="infra.error" x-text="infra.error"></p>
          <template x-if="infra.status">
            <div>
              <p class="muted" x-show="(infra.status.next_steps ?? []).length === 0" x-text="t('admin.infraAllGood')"></p>
              <template x-for="step in infra.status.next_steps ?? []" :key="step">
                <pre class="mono muted next-step" x-text="step"></pre>
              </template>
              <a class="link" href="#" @click.prevent="go('/ui/admin')" x-text="t('diag.goAdmin')"></a>
            </div>
          </template>
        </div>
      </section>

      <section class="page" x-show="route.name === 'admin'" x-cloak>
        <h1 x-text="t('admin.title')"></h1>
        <div class="project-actions">
          <button class="btn btn-sm" @click="go('/ui/onboarding')" x-text="t('admin.rerunWizard')"></button>
          <button class="btn btn-sm btn-danger" @click="rotateKey()" x-text="t('admin.rotateKey')"></button>
        </div>

        <h2 x-text="t('admin.infraTitle')"></h2>
        <p class="muted" x-text="t('admin.infraHint')"></p>
        <div class="card">
          <p class="muted" x-show="infra.loading && !infra.error && !infra.status" x-text="t('admin.infraLoading')"></p>
          <!-- Outside the `x-if` below on purpose: when the check itself
               fails, that block renders nothing, and the only control for
               recovering from the error would disappear with it. -->
          <div class="project-actions" x-show="infra.error">
            <p class="error-text grow" x-text="infra.error"></p>
            <button class="btn btn-sm" :disabled="infra.loading" @click="loadInfra()" x-text="t('action.recheck')"></button>
          </div>
          <template x-if="infra.status">
            <div>
              <dl class="data-grid mono">
                <dt x-text="t('admin.infraNetwork')"></dt>
                <dd>
                  <span class="badge" :class="infra.status.network_exists ? 'badge-running' : 'badge-build_failed'"
                        x-text="infra.status.network_exists ? t('admin.infraOk') : t('admin.infraMissing')"></span>
                  <span class="muted" x-text="infra.status.network"></span>
                </dd>
                <dt x-text="t('admin.infraTraefik')"></dt>
                <dd>
                  <span class="badge" :class="infra.status.traefik_status === 'running' ? 'badge-running' : 'badge-build_failed'"
                        x-text="infra.status.traefik_status"></span>
                  <span class="muted" x-text="t('admin.infraPort', { port: infra.status.traefik_http_port })"></span>
                </dd>
                <dt x-text="t('admin.infraWake')"></dt>
                <dd>
                  <span class="badge" :class="infra.status.self_wiring_ok ? 'badge-running' : 'badge-build_failed'"
                        x-text="infra.status.self_wiring_ok ? t('admin.infraOk') : t('admin.infraMissing')"></span>
                  <span class="muted" x-text="t('admin.infraWakeHint')"></span>
                </dd>
              </dl>
              <template x-for="step in infra.status.next_steps ?? []" :key="step">
                <pre class="mono muted next-step" x-text="step"></pre>
              </template>
              <p class="muted" x-show="(infra.status.next_steps ?? []).length === 0"
                 x-text="t('admin.infraAllGood')"></p>
              <div class="project-actions">
                <button class="btn btn-sm" :disabled="infra.loading" @click="loadInfra()" x-text="t('action.recheck')"></button>
                <button class="btn btn-sm" :disabled="infra.fixing" @click="repairInfra()"
                        x-text="infra.fixing ? t('action.working') : t('admin.infraRepair')"></button>
              </div>
            </div>
          </template>
        </div>

        <h2 x-text="t('admin.backupTitle')"></h2>
        <p class="muted" x-text="t('admin.backupHint')"></p>
        <div class="card">
          <div class="form-row">
            <button class="btn btn-sm" @click="downloadBackup()" x-text="t('admin.downloadBackup')"></button>
            <label class="btn btn-sm btn-danger file-btn">
              <span x-text="restore.busy ? t('action.working') : t('admin.restoreBackup')"></span>
              <input type="file" accept=".tar,application/x-tar" :disabled="restore.busy" @change="uploadRestore($event)" />
            </label>
          </div>
          <p class="muted" x-text="t('admin.restoreHint')"></p>
        </div>

        <h2 x-text="t('admin.tokensTitle')"></h2>
        <div class="deploy-form">
          <input
            class="token-input mono"
            type="text"
            :placeholder="t('admin.tokenNamePlaceholder')"
            x-model="newTokenName"
            @keydown.enter="createToken()"
          />
          <button class="btn btn-sm" @click="createToken()" x-text="t('action.create')"></button>
        </div>
        <p class="muted" x-show="tokens.length === 0" x-text="t('admin.noTokens')"></p>
        <ol class="audit-list">
          <template x-for="tok in tokens" :key="tok.id">
            <li>
              <span class="mono" x-text="tok.name"></span>
              <span class="mono muted" x-text="formatTime(tok.created_at)"></span>
              <span class="muted" x-text="tok.revoked ? t('admin.revoked') : ''"></span>
              <button class="btn btn-sm btn-danger" x-show="!tok.revoked" @click="revokeToken(tok)" x-text="t('admin.revoke')"></button>
            </li>
          </template>
        </ol>
      </section>
    </main>

    <div class="modal-backdrop" x-show="confirmModal.open" x-cloak @click.self="resolveConfirm(false)">
      <div class="modal modal-confirm">
        <div class="modal-body">
          <p x-text="confirmModal.message"></p>
          <div class="confirm-actions">
            <button class="btn btn-sm" @click="resolveConfirm(false)" x-text="t('action.cancel')"></button>
            <button class="btn btn-sm btn-danger" @click="resolveConfirm(true)" x-text="t('action.confirm')"></button>
          </div>
        </div>
      </div>
    </div>

    <footer class="footer">
      <span x-text="t('footer.tagline')"></span>
      <span x-text="t('footer.autoRefresh', { secs: refreshIntervalSecs })"></span>
    </footer>
  </body>
</html>
