[workspace]
resolver = "3"
members = ["crates/oxid-core", "crates/oxid-daemon", "crates/oxid-cli"]
default-members = ["crates/oxid-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "Ephemeral environments that breathe. Ferrous performance, invisible footprint."
publish = false

[workspace.dependencies]
oxid-core = { path = "crates/oxid-core" }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["serde", "macros", "formatting", "parsing"] }
toml = "0.8"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"