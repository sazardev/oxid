name: Release

# Builds `oxid` (CLI) and `oxidd` (daemon) for every platform on a version
# tag and attaches them to a GitHub Release. Also buildable manually
# (workflow_dispatch) against any ref, without creating a tag, to shake out
# platform-specific build issues (git2/openssl/sqlite all vendor C code —
# see comments below) before cutting a real release.
#
# Trigger a release: `git tag v0.1.0 && git push origin v0.1.0`

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mainstream glibc build — Debian/Ubuntu and compatible distros.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Static musl build: no libc version to match, runs unmodified on
          # any Linux distro — Arch, NixOS (see flake.nix for the native Nix
          # path too), Alpine, etc.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust target
        if: ${{ !matrix.cross }}
        run: rustup target add ${{ matrix.target }}

      # git2 (vendored-libgit2 + vendored-openssl) and sqlx's bundled sqlite
      # all compile C/C++ from source — cmake and perl drive those builds.
      # Native jobs need them on the runner directly; `cross` jobs get them
      # baked into the build container via Cross.toml.
      - name: Install native build dependencies (cmake, perl)
        if: runner.os == 'Linux' && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake perl
      - name: Install native build dependencies (cmake, perl)
        if: runner.os == 'macOS'
        run: brew install cmake

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build and upload (oxid CLI + oxidd daemon)
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: oxid,oxidd
          workspace: true
          target: ${{ matrix.target }}
          archive: oxid-$tag-${{ matrix.target }}
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
          # On workflow_dispatch (no tag), build and package as an artifact
          # only — don't try to attach to a release that doesn't exist.
          dry-run: ${{ github.event_name != 'push' }}

      - name: Upload build artifact (dry-run only)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: oxid-${{ matrix.target }}
          path: oxid-*.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
          if-no-files-found: ignore
