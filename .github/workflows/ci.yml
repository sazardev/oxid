name: CI

# The authoritative gate: everything .githooks/ checks locally, re-run here
# so it can't be skipped with `git push --no-verify`. See
# CONTRIBUTING.md#guardrails for the full rationale.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (per rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: oxid-core hexagonal boundary
        run: |
          source .githooks/_lib.sh
          check_hexagonal_boundary "$(pwd)"

      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build --workspace
        run: cargo build --workspace --all-targets

      - name: cargo test --workspace
        run: cargo test --workspace

  security:
    name: audit, deny, secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, needed for gitleaks

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: cargo audit (RustSec advisories)
        run: cargo audit

      - name: cargo deny check (licenses, bans, advisories, sources)
        run: cargo deny check

      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
